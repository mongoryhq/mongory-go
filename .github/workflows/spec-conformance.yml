name: mongory-spec conformance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "mongory-spec ref (branch, tag, or SHA) to test against"
        required: false
        default: "v0.2.1"

jobs:
  conformance:
    if: github.event_name != 'schedule'
    name: Conformance Go ${{ matrix.go-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: '1.22'
          - os: ubuntu-latest
            go-version: '1.26'
          - os: macos-15
            go-version: '1.26'
          - os: windows-latest
            go-version: '1.26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout mongory-spec
        uses: actions/checkout@v4
        with:
          repository: mongoryhq/mongory-spec
          ref: ${{ github.event.inputs.spec_ref || 'v0.2.1' }}
          path: mongory-spec

      - name: Show mongory-spec revision
        shell: bash
        working-directory: mongory-spec
        run: echo "mongory-spec $(cat VERSION) @ $(git rev-parse --short HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run conformance tests
        shell: bash
        env:
          MONGORY_SPEC_DIR: ${{ github.workspace }}/mongory-spec
        run: |
          set -o pipefail
          go test -run 'TestConformance' -v ./... 2>&1 | tee conformance.log

      - name: Fail if conformance was skipped
        shell: bash
        run: |
          if grep -q 'MONGORY_SPEC_DIR not set' conformance.log; then
            echo "conformance tests were skipped" >&2
            exit 1
          fi
          rm -f conformance.log

      - name: Run conformance tests with race detector
        if: runner.os != 'Windows'
        env:
          MONGORY_SPEC_DIR: ${{ github.workspace }}/mongory-spec
        run: go test -race -run 'TestConformance' ./...

  conformance-edge:
    name: Spec Edge Preview (mongory-spec@main)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout mongory-spec@main
        uses: actions/checkout@v4
        with:
          repository: mongoryhq/mongory-spec
          ref: main
          path: mongory-spec
      - name: Show mongory-spec revision
        working-directory: mongory-spec
        run: echo "mongory-spec $(cat VERSION) @ $(git rev-parse --short HEAD)"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run conformance tests
        env:
          MONGORY_SPEC_DIR: ${{ github.workspace }}/mongory-spec
        run: go test -race -run 'TestConformance' -v ./...
