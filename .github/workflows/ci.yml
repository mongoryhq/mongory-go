name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Go Vet
        run: go vet ./...

  test:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: '1.22'
          - os: ubuntu-latest
            go-version: '1.23'
          - os: ubuntu-latest
            go-version: '1.24'
          - os: ubuntu-latest
            go-version: '1.25'
          - os: ubuntu-latest
            go-version: '1.26'
          - os: macos-15
            go-version: '1.22'
          - os: macos-15
            go-version: '1.26'
          - os: windows-latest
            go-version: '1.22'
          - os: windows-latest
            go-version: '1.24'
          - os: windows-latest
            go-version: '1.26'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        shell: bash
        run: go build ./...
      - name: Test
        shell: bash
        run: go test -v ./...
      - name: Race Detector Tests
        if: runner.os != 'Windows'
        run: go test -race ./...

  cross-compile:
    name: Cross Compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Enforce minimum statement coverage (85%)
        shell: bash
        run: |
          go test -coverpkg=github.com/mongoryhq/mongory-go,github.com/mongoryhq/mongory-go/internal/engine -coverprofile=coverage.out .
          go tool cover -func=coverage.out
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total coverage: ${total}%"
          awk -v cov="$total" -v min=85.0 'BEGIN { if (cov + 0 < min) { printf "coverage %.1f%% < %.1f%%\n", cov, min > "/dev/stderr"; exit 1 } }'
          rm -f coverage.out

  fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run fuzz targets
        shell: bash
        run: |
          go test -run='^$' -fuzz='^FuzzCompile$' -fuzztime=5s .
          go test -run='^$' -fuzz='^FuzzMatch$' -fuzztime=5s .
          go test -run='^$' -fuzz='^FuzzStructMatch$' -fuzztime=5s .

  benchmark:
    name: Benchmark & Zero-Alloc Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run benchmarks and enforce zero-alloc / O(1) $in gates
        shell: bash
        run: |
          set -o pipefail
          go test -run='^$' -bench='^BenchmarkMatch$' -benchmem -benchtime=200ms -count=3 . | tee bench.txt
          cat bench.txt >> "$GITHUB_STEP_SUMMARY"
          awk '
            /^BenchmarkMatch\/.*\/(maps|structs_count)(-[0-9]+)?[ \t]/ {
              seen_zero_check++
              alloc = -1
              nsrec = -1
              for (i = 2; i <= NF; i++) {
                if ($i == "allocs/op") alloc = $(i-1) + 0
                if ($i == "ns/record") nsrec = $(i-1) + 0
              }
              if (alloc < 0 || alloc > 0) {
                printf "expected 0 allocs/op on %s, got %d\n", $1, alloc > "/dev/stderr"
                exit 1
              }
              if ($1 ~ /^BenchmarkMatch\/simple\/maps/) {
                simple_sum += nsrec; simple_n++
              }
              if ($1 ~ /^BenchmarkMatch\/large_in\/maps/) {
                large_sum += nsrec; large_n++
              }
            }
            END {
              if (seen_zero_check == 0 || simple_n == 0 || large_n == 0) {
                print "missing expected BenchmarkMatch rows" > "/dev/stderr"
                exit 1
              }
              simple_avg = simple_sum / simple_n
              large_avg = large_sum / large_n
              if (simple_avg > 0 && large_avg > simple_avg * 6.0) {
                printf "large_in/maps regression: %.2f ns/record > 6x simple/maps (%.2f ns/record)\n", large_avg, simple_avg > "/dev/stderr"
                exit 1
              }
            }
          ' bench.txt
          rm -f bench.txt
